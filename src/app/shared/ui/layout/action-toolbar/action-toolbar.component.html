<div class="action-toolbar">
  @for (action of primaryActions; track action.id) {
    <app-button
      size="sm"
      [label]="action.label"
      [icon]="action.icon"
      variant="primary"
      [disabled]="isActionDisabled(action)"
      [loading]="action.loading ?? false"
      [tooltip]="actionTooltip(action)"
      (buttonClick)="emitAction(action)"
    ></app-button>
  }

  @for (action of secondaryActions; track action.id) {
    <app-button
      size="sm"
      [label]="action.label"
      [icon]="action.icon"
      [variant]="buttonVariant(action)"
      [disabled]="isActionDisabled(action)"
      [loading]="action.loading ?? false"
      [tooltip]="actionTooltip(action)"
      (buttonClick)="emitAction(action)"
    ></app-button>
  }

  @if (hasMoreActions) {
    <div class="action-toolbar__more-wrap">
      <app-button
        class="action-toolbar__more"
        size="sm"
        icon="pi pi-ellipsis-h"
        variant="ghost"
        [ariaLabel]="'showMore'"
        [tooltip]="'showMore'"
        (buttonClick)="toggleMore()"
      ></app-button>

      @if (moreOpen()) {
        <div class="action-toolbar__menu" role="menu">
          @for (action of moreActions; track action.id) {
            <app-button
              class="action-toolbar__menu-item"
              size="sm"
              [label]="action.label"
              [icon]="action.icon"
              [variant]="buttonVariant(action)"
              [disabled]="isActionDisabled(action)"
              [loading]="action.loading ?? false"
              [tooltip]="actionTooltip(action)"
              (buttonClick)="emitAction(action)"
            ></app-button>
          }
        </div>
      }
    </div>
  }
</div>
