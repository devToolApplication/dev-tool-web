<div
  class="app-input-text-wrap"
  [class.app-input-text-wrap--invalid]="invalid"
  [class.app-input-text-wrap--disabled]="disabled"
>
  @if (iconClass) {
    <span class="app-input-icon" aria-hidden="true">
      <i [class]="iconClass"></i>
    </span>
  }
  <input
    [id]="inputId"
    [attr.name]="name || inputId"
    type="text"
    [ngModel]="value"
    (ngModelChange)="onChange($event)"
    [disabled]="disabled"
    [readOnly]="readonly"
    [required]="required"
    [attr.autofocus]="autofocus ? true : null"
    [attr.placeholder]="placeholder || null | translateContent"
    [attr.aria-invalid]="invalid || null"
    [attr.aria-describedby]="describedBy || null"
    [attr.autocomplete]="autocomplete"
    [attr.inputmode]="inputMode || null"
    class="app-input-text"
    [class.app-input-text--with-icon]="iconClass"
    [class]="styleClass || ''"
    (blur)="onBlur()"
    (focus)="onFocus()"
  />
</div>
