<div class="input-area">
  @if (contentType === 'json') {
    <div class="input-area__json-shell" [class.input-area__json-shell--invalid]="invalid">
      <div
        class="input-area__json-editor"
        [class.input-area__json-editor--with-zoom]="showZoomButton"
        [style.height]="inlineJsonHeight"
        [style.maxHeight]="inlineJsonHeight"
      >
        @if (showZoomButton) {
          <div class="input-area__zoom-overlay">
            <button
              type="button"
              class="rounded p-1 text-[var(--app-text-muted)] hover:text-[var(--app-primary)] hover:bg-[var(--app-chart-primary-fill)] transition-colors"
              [disabled]="disabled"
              [attr.aria-label]="'shared.inputArea.expand' | translateContent"
              [attr.title]="'shared.inputArea.expand' | translateContent"
              (click)="openZoom()"
            ><i class="pi pi-window-maximize text-sm"></i></button>
          </div>
        }
        <div #inlineJsonHost class="input-area__json-editor-host"></div>
      </div>
    </div>
  } @else {
    <div class="app-field" [class.app-field--invalid]="invalid">
      <div class="relative">
        @if (showZoomButton) {
          <div class="absolute top-2 right-2 z-10">
            <button
              type="button"
              class="rounded p-1 text-[var(--app-text-muted)] hover:text-[var(--app-primary)] hover:bg-[var(--app-chart-primary-fill)] transition-colors"
              [disabled]="disabled"
              [attr.aria-label]="'shared.inputArea.expand' | translateContent"
              [attr.title]="'shared.inputArea.expand' | translateContent"
              (click)="openZoom()"
            ><i class="pi pi-window-maximize text-sm"></i></button>
          </div>
        }
        @if (iconClass) {
          <span class="absolute left-3 top-3 text-[var(--app-text-muted)]" aria-hidden="true">
            <i [class]="iconClass"></i>
          </span>
        }
        <textarea
          [id]="inputId"
          [rows]="rows"
          [ngModel]="value"
          (ngModelChange)="onChange($event)"
          [disabled]="disabled"
          [readOnly]="readonly"
          [required]="required"
          [attr.autofocus]="autofocus ? true : null"
          [attr.placeholder]="(placeholder || null) | translateContent"
          [attr.aria-invalid]="invalid || null"
          class="peer w-full rounded-lg border bg-[var(--app-custom-input-bg)] px-3 py-2.5 text-sm text-[var(--app-custom-input-text)] outline-none transition-all duration-150 border-[var(--app-input-border)] hover:border-[var(--app-primary)] focus:border-[var(--app-primary)] focus:ring-2 focus:ring-[var(--app-primary)]/25 disabled:cursor-not-allowed disabled:opacity-60 resize-y overflow-y-auto"
          [class.pl-9]="iconClass"
          [class.pr-10]="showZoomButton"
          [class]="styleClass || ''"
          [style.maxHeight]="inlineTextMaxHeight"
          (blur)="onBlur()"
          (focus)="onFocus()"
        ></textarea>
      </div>
    </div>
  }
</div>

<app-base-popup
  [visible]="zoomVisible"
  [modal]="true"
  [appendTo]="'body'"
  position="center"
  styleClass="input-area-zoom-dialog"
  maskStyleClass="input-area-zoom-dialog-mask"
  [maximizable]="true"
  [width]="'min(96vw, 72rem)'"
  [header]="(label || placeholder || 'content') | translateContent"
  [showDefaultCancel]="false"
  [showDefaultConfirm]="false"
  [showFooter]="false"
  (visibleChange)="zoomVisible = $event"
  (hide)="closeZoom()"
  (cancel)="closeZoom()"
>
  @if (contentType === 'json') {
    <div #dialogJsonContainer class="input-area__json-editor input-area__json-editor--dialog"></div>
  } @else {
    <textarea
      class="w-full min-h-[65vh] rounded-lg border bg-[var(--app-custom-input-bg)] px-3 py-2.5 text-sm text-[var(--app-custom-input-text)] outline-none transition-all duration-150 border-[var(--app-input-border)] focus:border-[var(--app-primary)] focus:ring-2 focus:ring-[var(--app-primary)]/25"
      [ngModel]="value"
      (ngModelChange)="onChange($event)"
      [disabled]="disabled"
      [readOnly]="readonly"
    ></textarea>
  }
</app-base-popup>
