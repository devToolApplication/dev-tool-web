<button
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading || null"
  [attr.aria-label]="resolvedAriaLabel | translateContent"
  [attr.title]="tooltip || null | translateContent"
  [ngClass]="computedClasses"
  (click)="onClick($event)"
>
  @if (loading) {
    <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
  } @else if (icon) {
    <i [class]="icon" aria-hidden="true"></i>
  }

  @if (!iconOnly && label) {
    <span>{{ label | translateContent }}</span>
  }
</button>
