<section
  class="form-section-card"
  [class]="'form-section-card--' + density"
  [class.form-section-card--error]="section.errorCount > 0"
  [id]="'form-section-' + section.id"
  [attr.data-form-section-id]="section.id"
>
  @if (section.title) {
    <header class="form-section-card__header">
      <div class="form-section-card__title">
        @if (section.icon) {
          <i [class]="section.icon" aria-hidden="true"></i>
        }
        <div>
          <h3>{{ section.title | translateContent }}</h3>
          @if (section.description) {
            <p>{{ section.description | translateContent }}</p>
          }
        </div>
      </div>

      <div class="form-section-card__meta">
        @if (section.optional) {
          <span class="text-xs text-[var(--app-text-muted)]">({{ 'common.optional' | translateContent }})</span>
        }
        @if (section.collapsible) {
          <app-button
            type="button"
            variant="ghost"
            size="sm"
            [icon]="collapsed() ? 'pi pi-chevron-down' : 'pi pi-chevron-up'"
            [label]="collapsed() ? 'open' : 'collapse'"
            (buttonClick)="toggleCollapsed()"
          ></app-button>
        }
      </div>
    </header>
  }

  @if (!collapsed()) {
    <div class="form-section-card__body">
      <ng-content></ng-content>
    </div>
  }
</section>
