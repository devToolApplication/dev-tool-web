<app-base-crud-page
  [pageConfig]="pageConfig"
  [formConfig]="formConfig"
  [formContext]="formContext"
  [formInitialValue]="formInitialValue"
  [submitting]="submitting()"
  (valueChange)="onValueChange($event)"
  (actionClick)="onActionClick($event)"
  (formSubmit)="submit($event)"
>
  <div crud-page-after-first-section class="rule-editor-section">
      <app-flow-builder
        class="rule-editor-section__flow"
        [value]="ruleFlowDefinition()"
        [nodeTypes]="ruleFlowNodeTypes"
        [toolbar]="ruleFlowToolbar"
        [mode]="submitting() ? 'readonly' : 'edit'"
        [autoLayout]="true"
        (valueChange)="onFlowValueChange($event)"
        (nodeClick)="onFlowNodeClick($event)"
        (connect)="onFlowConnect($event)"
        (command)="onFlowCommand($event)"
      />
  </div>
</app-base-crud-page>

@if (showPreview()) {
  <app-config-preview-panel
    previewType="rule"
    [configPayload]="previewPayload()"
    (closed)="showPreview.set(false)"
  />
}
