<app-page-shell title="layout.menu.secretManagement" layout="wide">
  <app-tabs [tabs]="tabs" [value]="activeTab()" (valueChange)="onTabChange($event)"></app-tabs>

  <div style="margin-top: 1rem;">
    @switch (activeTab()) {
      @case ('ai-agent') {
        <app-ai-agent-secret-list></app-ai-agent-secret-list>
      }
      @case ('trade-bot') {
        <app-trade-bot-secret-list></app-trade-bot-secret-list>
      }
      @case ('file-storage') {
        <app-storage-secret-list></app-storage-secret-list>
      }
      @case ('jobs') {
        <app-job-secret-list></app-job-secret-list>
      }
    }
  </div>
</app-page-shell>
