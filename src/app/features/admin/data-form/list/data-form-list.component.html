<app-table
  [config]="tableConfig"
  [data]="rows"
  [pageResponse]="pageResponse"
  [loading]="pageLoading()"
  [error]="pageError()"
  [sortField]="sortField"
  [sortOrder]="sortOrder"
  (search)="onSearch($event)"
  (resetFilter)="onResetFilter()"
  (pageChange)="onPageChange($event)"
  (sortChange)="onSortChange($event)"
  (create)="onCreate()"
>
</app-table>
