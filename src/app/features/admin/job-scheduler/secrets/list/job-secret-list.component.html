<app-page-shell title="jobSecret.list.pageTitle" layout="wide">
  <div class="secret-tabs">
    @for (tab of tabs; track tab.value) {
      <button
        class="secret-tab"
        [class.active]="activeTab() === tab.value"
        (click)="onTabChange(tab.value)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <app-table
    [config]="tableConfig"
    [data]="rows"
    [pageResponse]="pageResponse"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    [loading]="pageLoading()"
    [error]="pageError()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (search)="onSearch($any($event))"
    (resetFilter)="onResetFilter()"
    (create)="onCreate()"
    (retry)="refreshPage()"
  ></app-table>
</app-page-shell>
