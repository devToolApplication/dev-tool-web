@if (node) {
  <form class="workflow-bpmn-drawer" aria-label="BPMN gateway configuration">
    <section class="workflow-bpmn-drawer__section">
      <h3>{{ 'workflowStudio.inspector.section.general' | translateContent }}</h3>
      <app-input-text
        label="workflowStudio.bpmn.drawer.name"
        [value]="name"
        [readonly]="readonly"
        (valueChange)="updateName($event)"
      ></app-input-text>
      <app-input-text
        label="workflowStudio.inspector.type"
        [value]="node.type"
        [readonly]="true"
      ></app-input-text>
    </section>

    <section class="workflow-bpmn-drawer__section">
      <h3>{{ 'workflowStudio.inspector.section.configuration' | translateContent }}</h3>
      <app-input-area
        label="workflowStudio.inspector.config"
        contentType="json"
        [rows]="5"
        [maxRows]="12"
        [value]="config"
        [readonly]="readonly"
        [invalid]="!!jsonError"
        [errorMessage]="jsonError ?? undefined"
        (valueChange)="updateConfig($event)"
      ></app-input-area>
    </section>
  </form>
}
