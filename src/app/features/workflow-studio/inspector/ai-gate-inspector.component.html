<div class="ai-gate-inspector">
  @if (agentState() === 'error') {
    <div class="mb-4">
      <app-alert
        variant="danger"
        title="workflowStudio.inspector.agentErrorTitle"
        message="workflowStudio.inspector.agentErrorMessage"
        actionLabel="workflowStudio.inspector.retry"
        (action)="retryAgents()"
      ></app-alert>
    </div>
  }

  @if (outputSchemaState() === 'error') {
    <div class="mb-4">
      <app-alert
        variant="danger"
        title="workflowStudio.inspector.outputSchemaErrorTitle"
        message="workflowStudio.inspector.outputSchemaErrorMessage"
        actionLabel="workflowStudio.inspector.retry"
        (action)="retryOutputSchemas()"
      ></app-alert>
    </div>
  }

  <app-form-input
    [config]="config"
    [context]="formContext"
    [initialValue]="initialValue"
    (valueChange)="formValueChange($any($event))"
  ></app-form-input>

  <div id="ai-gate-section-decision" class="mt-4 border-t border-[var(--app-border)] pt-4">
    <label class="mb-2 block text-sm font-semibold text-[var(--app-text)]">
      {{ 'workflowStudio.inspector.criteria' | translateContent }}
    </label>
    <app-workflow-json-object-editor
      [value]="criteriaValue"
      [readonly]="readonly"
      (valueChange)="onCriteriaChange($event)"
    ></app-workflow-json-object-editor>
  </div>

  <div id="ai-gate-section-input" class="mt-4 border-t border-[var(--app-border)] pt-4">
    <label class="mb-2 block text-sm font-semibold text-[var(--app-text)]">
      {{ 'workflowStudio.inspector.inputMapping' | translateContent }}
    </label>
    <app-workflow-input-mapping-editor
      [value]="inputMappingValue"
      [readonly]="readonly"
      (valueChange)="onInputMappingChange($event)"
    ></app-workflow-input-mapping-editor>
  </div>
</div>
