<app-dialog
  [visible]="visible"
  (visibleChange)="visible = $event"
  [header]="'workflowStudio.lifecycle.runWorkflow' | translateContent"
  [width]="'32rem'"
  [modal]="true"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="workflow-run-dialog flex flex-col gap-4">
    <div class="flex flex-col gap-1.5">
      <app-select
        formControlName="workflowId"
        label="workflowStudio.lifecycle.workflow"
        placeholder="workflowStudio.lifecycle.searchPlaceholder"
        [options]="workflowOptions"
        [required]="true"
        [invalid]="!!(form.get('workflowId')?.touched && form.get('workflowId')?.invalid)"
        errorMessage="workflowStudio.lifecycle.workflow"
      ></app-select>
    </div>

    <div class="flex flex-col gap-1.5">
      <app-input-area
        formControlName="inputPayload"
        label="workflowStudio.lifecycle.runInput"
        placeholder="{}"
        [rows]="6"
        contentType="json"
        [required]="true"
        [invalid]="!!jsonError"
        [errorMessage]="jsonError ?? undefined"
      ></app-input-area>
    </div>

    <div class="mt-2 flex flex-col-reverse justify-end gap-2 sm:flex-row">
      <app-button
        variant="ghost"
        type="button"
        (buttonClick)="close()"
        [label]="'common.cancel' | translateContent"
      ></app-button>
      <app-button
        variant="primary"
        type="submit"
        [loading]="submitting"
        [disabled]="submitting"
        [label]="'workflowStudio.lifecycle.run' | translateContent"
      ></app-button>
    </div>
  </form>
</app-dialog>
