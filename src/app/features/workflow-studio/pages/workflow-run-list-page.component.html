<app-page-shell
  [title]="'workflowStudio.lifecycle.runsTitle' | translateContent"
  [subtitle]="'workflowStudio.lifecycle.runsDescription' | translateContent"
>
  <div class="flex flex-col gap-4">
    <app-action-toolbar [actions]="actions" (actionClick)="onToolbarAction($event)"></app-action-toolbar>

    <app-filter-panel
      [filters]="filterFields()"
      (apply)="onFilterChange($event)"
      (reset)="onFilterReset()"
    ></app-filter-panel>

    <div *ngIf="error()" class="rounded-md border border-[var(--app-control-danger-border)] bg-[var(--app-control-danger-bg)] p-4 text-sm text-[var(--app-control-danger-text)]">
      {{ error() | translateContent }}
    </div>

    <app-table
      [config]="tableConfig()"
      [data]="runs()"
      [loading]="loading()"
      [totalRecords]="totalRecords()"
      [currentPage]="currentPage()"
      [rows]="rows()"
      (rowClick)="openDebugger($event)"
      (actionClick)="onTableAction($event)"
      (pageChange)="loadRuns($event.page, $event.rows)"
      (refresh)="loadRuns(currentPage(), rows())"
    ></app-table>
  </div>
</app-page-shell>

<app-workflow-run-trigger-dialog
  #triggerDialog
  (runStarted)="onRunStarted($event)"
></app-workflow-run-trigger-dialog>
