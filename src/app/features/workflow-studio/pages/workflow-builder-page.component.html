<app-page-shell
  [title]="store.workflow()?.definition?.name ?? 'workflowStudio.lifecycle.builderTitle'"
  subtitle="workflowStudio.lifecycle.builderDescription"
  layout="full"
  [breadcrumb]="[
    { label: 'layout.menu.aiAgentMcrs' },
    { label: 'workflowStudio.lifecycle.workflows', routerLink: '/ai-agent-mcrs/workflows' },
    { label: store.workflow()?.definition?.id ? 'layout.route.edit' : 'layout.route.create' },
  ]"
  [loading]="loading()"
  [error]="error()"
>
  <div page-actions class="workflow-builder-header-actions">
    <app-action-toolbar
      [actions]="actions()"
      (actionClick)="onToolbarAction($event)"
    ></app-action-toolbar>
  </div>

  <input
    #bpmnImportInput
    type="file"
    accept=".bpmn,.xml,application/xml,text/xml"
    hidden
    (change)="onBpmnImportSelected($event)"
  />

  <div class="workflow-builder">
    <div class="workflow-builder__top-bar">
      <div class="workflow-builder__identity">
        <app-input-text
          [value]="store.workflow()?.definition?.name ?? ''"
          [placeholder]="'workflowStudio.lifecycle.untitled' | translateContent"
          [readonly]="readonlyMode()"
          styleClass="workflow-builder__name-field"
          (valueChange)="updateName($event)"
        ></app-input-text>

        <app-badge
          [label]="statusBadge().label"
          [variant]="statusBadge().variant"
        ></app-badge>

        <app-button
          icon="pi pi-info-circle"
          [iconOnly]="true"
          variant="ghost"
          size="sm"
          [tooltip]="'workflowStudio.lifecycle.description' | translateContent"
          (buttonClick)="openDescriptionDialog()"
        ></app-button>
      </div>

      <div class="workflow-builder__top-controls">
        <app-button
          [icon]="propertiesPanelCollapsed() ? 'pi pi-chevron-left' : 'pi pi-chevron-right'"
          [label]="(propertiesPanelCollapsed() ? 'workflowStudio.bpmn.showProperties' : 'workflowStudio.bpmn.hideProperties') | translateContent"
          variant="ghost"
          size="sm"
          (buttonClick)="togglePropertiesPanel()"
        ></app-button>
      </div>
    </div>

    <section class="workflow-builder__workspace">
      <section class="workflow-builder__canvas" aria-label="Workflow canvas">
        <app-workflow-bpmn-canvas
          [bpmnXml]="store.bpmnXml()"
          [workflowId]="store.workflow()?.definition?.id || 'new-workflow'"
          [workflowName]="store.workflow()?.definition?.name ?? undefined"
          [viewport]="store.viewport()"
          [mode]="store.mode()"
          [selectedId]="selectedId()"
          [validationIssues]="store.validationIssues()"
          [propertiesCollapsed]="propertiesPanelCollapsed()"
          (bpmnXmlChange)="updateBpmnXml($event)"
          (nodeSelected)="store.selectNode($event)"
          (edgeSelected)="store.selectEdge($event)"
          (viewportChange)="store.setViewport($event)"
        ></app-workflow-bpmn-canvas>
      </section>
    </section>
  </div>

  @if (statusMessage()) {
    <div class="mt-2">
      <app-alert variant="success" [message]="statusMessage()!"></app-alert>
    </div>
  }
  <app-workflow-problems-panel
    [issues]="store.validationIssues()"
    (issueSelected)="onProblemSelected($event)"
  ></app-workflow-problems-panel>
</app-page-shell>

<app-drawer
  [open]="descriptionDialogOpen()"
  title="workflowStudio.lifecycle.description"
  size="sm"
  (closed)="closeDescriptionDialog()"
>
  <div class="workflow-desc-drawer">
    <app-input-area
      label="workflowStudio.lifecycle.description"
      [value]="store.workflow()?.definition?.description ?? ''"
      [readonly]="readonlyMode()"
      [rows]="6"
      [maxRows]="12"
      (valueChange)="updateDescription($event)"
    ></app-input-area>
    <div class="workflow-desc-drawer__actions">
      <app-button
        label="close"
        variant="primary"
        size="md"
        (buttonClick)="closeDescriptionDialog()"
      ></app-button>
    </div>
  </div>
</app-drawer>

<app-drawer
  [open]="versionsOpen()"
  title="workflowStudio.lifecycle.versions"
  size="md"
  (closed)="closeVersions()"
>
  <div class="workflow-versions">
    @for (version of store.workflow()?.versions ?? []; track version.id) {
      <button
        type="button"
        class="workflow-versions__item"
        [class.workflow-versions__item--selected]="version.id === selectedVersionId()"
        (click)="selectVersion(version.id)"
      >
        <span>{{ versionLabel(version) }}</span>
        @if (version.status === 'PUBLISHED') {
          <app-badge label="workflowStudio.lifecycle.readonly" variant="muted"></app-badge>
        }
      </button>
    }
  </div>
</app-drawer>

<app-drawer
  [open]="importDialogOpen()"
  title="workflowStudio.bpmn.importXmlTitle"
  size="lg"
  (closed)="closeImportDialog()"
>
  <div class="workflow-import-drawer">
    <div class="workflow-import-drawer__toolbar">
      <app-button
        label="workflowStudio.bpmn.importFileBtn"
        icon="pi pi-folder-open"
        variant="secondary"
        size="sm"
        (buttonClick)="openBpmnImport(bpmnImportInput)"
      ></app-button>
    </div>

    <app-input-area
      label="workflowStudio.bpmn.importXmlPlaceholder"
      [value]="importXmlText()"
      [rows]="16"
      [maxRows]="28"
      (valueChange)="importXmlText.set($event ?? '')"
    ></app-input-area>

    <div class="workflow-import-drawer__actions">
      <app-button
        label="cancel"
        variant="ghost"
        size="md"
        (buttonClick)="closeImportDialog()"
      ></app-button>
      <app-button
        label="workflowStudio.bpmn.applyXml"
        icon="pi pi-check"
        variant="primary"
        size="md"
        (buttonClick)="applyImportXml()"
      ></app-button>
    </div>
  </div>
</app-drawer>
