<div class="agent-provider-selector">
  <app-select
    label="koc.agent.selector.agent"
    placeholder="koc.agent.selector.agentPlaceholder"
    [options]="agentOptions"
    [value]="value?.agentCode ?? null"
    [disabled]="disabled || readonly"
    [loading]="loading"
    (valueChange)="onAgentChange($event)"
  ></app-select>

  <fieldset class="agent-provider-selector__providers" [disabled]="disabled || readonly">
    <legend>{{ 'koc.agent.selector.provider' | translateContent }}</legend>

    @if (providerStates.length) {
      <div class="agent-provider-selector__provider-list" role="radiogroup">
        @for (provider of providerStates; track provider.provider) {
          <label
            class="agent-provider-selector__provider"
            [class.agent-provider-selector__provider--selected]="isProviderChecked(provider.provider)"
            [class.agent-provider-selector__provider--disabled]="isProviderDisabled(provider.provider)"
          >
            <input
              type="radio"
              [name]="'koc-provider-' + (value?.agentCode ?? 'agent')"
              [value]="provider.provider"
              [checked]="isProviderChecked(provider.provider)"
              [disabled]="isProviderDisabled(provider.provider)"
              (change)="onProviderChange(provider.provider)"
            />
            <span>{{ providerLabel(provider.provider) | translateContent }}</span>
            <app-badge
              [label]="providerHealthLabel(provider.health)"
              [variant]="providerHealthVariant(provider.health)"
              size="sm"
            ></app-badge>
          </label>
        }
      </div>
    } @else {
      <p class="agent-provider-selector__empty">
        {{ 'koc.agent.selector.noProviders' | translateContent }}
      </p>
    }
  </fieldset>
</div>
