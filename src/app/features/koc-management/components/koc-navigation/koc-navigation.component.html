<nav class="koc-navigation" [attr.aria-label]="'koc.navigation.label' | translateContent">
  @for (item of items; track item.routerLink) {
    <a
      class="koc-navigation__link"
      [routerLink]="item.routerLink"
      routerLinkActive="koc-navigation__link--active"
      [routerLinkActiveOptions]="{ exact: item.exact }"
    >
      <i [class]="item.icon" aria-hidden="true"></i>
      <span>{{ item.label | translateContent }}</span>
    </a>
  }
</nav>
