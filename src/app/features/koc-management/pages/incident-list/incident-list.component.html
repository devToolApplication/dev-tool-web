<app-koc-page-frame title="koc.incidents.title" subtitle="koc.incidents.subtitle">
  @if (activeBanner(); as incident) {
    <app-alert
      variant="danger"
      title="koc.incident.banner.title"
      [message]="'koc.incident.banner.description'"
      actionLabel="koc.incident.banner.action"
      (action)="openIncident(incident)"
    ></app-alert>
  }

  <app-section-panel title="koc.incidents.sectionTitle" subtitle="koc.incidentList.sectionSubtitle">
    @if (loading()) {
      <app-loading-skeleton type="list" [rows]="6"></app-loading-skeleton>
    } @else if (error()) {
      <app-error-state
        title="koc.incidentList.error.title"
        [message]="error() ?? 'koc.incidentList.error.loadFailed'"
        retryLabel="retry"
        (retry)="loadIncidents()"
      ></app-error-state>
    } @else if (incidents().length === 0) {
      <app-empty-state
        title="koc.incidentList.empty.title"
        description="koc.incidentList.empty.description"
      ></app-empty-state>
    } @else {
      <div class="incident-list__rows" role="list">
        @for (incident of incidents(); track incident.incidentId) {
          <button type="button" class="incident-list__row" role="listitem" (click)="openIncident(incident)">
            <span>
              <strong>{{ incident.dependencyKey }}</strong>
              <small>{{ incident.agentCode || ('notAvailable' | translateContent) }} / {{ incident.provider || ('notAvailable' | translateContent) }}</small>
            </span>
            <app-koc-status-badge [status]="incident.status" size="sm"></app-koc-status-badge>
            <span>{{ 'koc.incident.detail.waitingWorkflows' | translateContent }}: {{ incident.waitingWorkflows }}</span>
            <span>{{ 'koc.incident.detail.affectedCampaigns' | translateContent }}: {{ incident.affectedCampaigns }}</span>
          </button>
        }
      </div>
      <p class="incident-list__count">{{ 'koc.incidentList.total' | translateContent }}: {{ totalRecords() }}</p>
    }
  </app-section-panel>
</app-koc-page-frame>
