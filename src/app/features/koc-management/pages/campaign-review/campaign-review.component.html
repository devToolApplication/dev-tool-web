<app-koc-page-frame [title]="title" [subtitle]="subtitle">
  <section class="campaign-review">
    <app-section-panel [title]="sectionTitle">
      <dl>
        <div>
          <dt>{{ 'koc.campaignReview.campaignId' | translateContent }}</dt>
          <dd>{{ campaignId }}</dd>
        </div>
        @if (candidateId) {
          <div>
            <dt>{{ 'koc.campaignReview.candidateId' | translateContent }}</dt>
            <dd>{{ candidateId }}</dd>
          </div>
        }
      </dl>
    </app-section-panel>
  </section>
</app-koc-page-frame>
