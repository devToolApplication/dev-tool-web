<app-koc-page-frame title="koc.candidates.title" subtitle="koc.candidates.subtitle">
  <app-section-panel title="koc.candidates.sectionTitle" subtitle="koc.candidates.sectionSubtitle">
    <div class="candidate-list__filters">
      <app-input-text
        label="koc.candidates.filter.search"
        [value]="query().search ?? ''"
        (valueChange)="onSearch($event)"
      ></app-input-text>
      <app-select
        label="koc.candidates.filter.decision"
        [options]="decisionOptions"
        [value]="query().decision ?? null"
        (valueChange)="onDecisionFilter($event)"
      ></app-select>
      <app-select
        label="koc.candidates.filter.executionStatus"
        [options]="executionStatusOptions"
        [value]="query().executionStatus ?? null"
        (valueChange)="onExecutionStatusFilter($event)"
      ></app-select>
    </div>

    <div class="candidate-list__quick" [attr.aria-label]="'koc.candidates.quick.label' | translateContent">
      @for (item of quickDecisionOptions; track item.label) {
        <app-button
          type="button"
          size="sm"
          [variant]="query().decision === item.decision ? 'primary' : 'secondary'"
          [label]="item.label"
          (buttonClick)="applyQuickDecision(item.decision)"
        ></app-button>
      }
    </div>

    @if (loading()) {
      <app-loading-skeleton type="list" [rows]="6"></app-loading-skeleton>
    } @else if (error()) {
      <app-error-state
        title="koc.candidates.error.title"
        [message]="error() ?? 'koc.candidates.error.loadFailed'"
        retryLabel="retry"
        (retry)="loadCandidates()"
      ></app-error-state>
    } @else if (candidates().length === 0) {
      <app-empty-state
        title="koc.candidates.empty.title"
        description="koc.candidates.empty.description"
      ></app-empty-state>
    } @else {
      <div class="candidate-list__rows" role="list" [attr.aria-label]="'koc.candidates.sectionTitle' | translateContent">
        @for (candidate of candidates(); track candidate.candidateId) {
          <button type="button" class="candidate-list__row" role="listitem" (click)="openCandidate(candidate)">
            <span class="candidate-list__identity">
              <strong>{{ candidate.displayName }}</strong>
              <small>{{ candidate.campaignId }}</small>
            </span>
            <span class="candidate-list__status">
              <app-koc-status-badge [status]="candidate.decision" size="sm"></app-koc-status-badge>
              <app-koc-status-badge [status]="candidate.executionStatus" size="sm"></app-koc-status-badge>
            </span>
            <span class="candidate-list__meta">
              <span>{{ 'koc.candidates.column.followers' | translateContent }}: {{ candidate.followers ?? ('notAvailable' | translateContent) }}</span>
              <span>{{ 'koc.candidates.column.progress' | translateContent }}: {{ candidate.screeningProgress ?? 0 }}%</span>
            </span>
            <span class="candidate-list__reason">
              {{ candidate.reason || ('notAvailable' | translateContent) }}
            </span>
          </button>
        }
      </div>
      <p class="candidate-list__count">
        {{ 'koc.candidates.total' | translateContent }}: {{ totalRecords() }}
      </p>
    }
  </app-section-panel>
</app-koc-page-frame>
