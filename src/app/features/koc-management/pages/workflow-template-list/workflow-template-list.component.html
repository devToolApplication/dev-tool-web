<app-koc-page-frame
  title="koc.configuration.workflowTemplates.title"
  subtitle="koc.configuration.workflowTemplates.subtitle"
>
  <app-section-panel
    title="koc.configuration.workflowTemplates.sectionTitle"
    subtitle="koc.configuration.workflowTemplates.subtitle"
  >
    @if (loading()) {
      <app-loading-skeleton type="list" [rows]="5"></app-loading-skeleton>
    } @else if (error()) {
      <app-error-state
        title="koc.workflowTemplates.error.title"
        [message]="error() ?? 'koc.workflowTemplates.error.loadFailed'"
        retryLabel="retry"
        (retry)="loadTemplates()"
      ></app-error-state>
    } @else if (templates().length === 0) {
      <app-empty-state
        title="koc.workflowTemplates.empty.title"
        description="koc.workflowTemplates.empty.description"
      ></app-empty-state>
    } @else {
      <div class="workflow-template-list__rows" role="list" [attr.aria-label]="'koc.configuration.workflowTemplates.sectionTitle' | translateContent">
        @for (template of templates(); track template.templateId) {
          <div class="workflow-template-list__row" role="listitem">
            <div class="workflow-template-list__identity">
              <strong>{{ template.name }}</strong>
              <small>{{ template.templateId }}</small>
            </div>

            <div class="workflow-template-list__description">
              <span>{{ template.description || ('notAvailable' | translateContent) }}</span>
            </div>

            <div class="workflow-template-list__status">
              <app-koc-status-badge [status]="template.active ? 'ACTIVE' : 'DISABLED'" size="sm"></app-koc-status-badge>
            </div>

            <div class="workflow-template-list__actions">
              <app-button
                size="sm"
                variant="secondary"
                icon="pi pi-play"
                [label]="'koc.workflowTemplates.action.useInCampaign'"
                (buttonClick)="useTemplate(template)"
              ></app-button>
            </div>
          </div>
        }
      </div>
    }
  </app-section-panel>
</app-koc-page-frame>
