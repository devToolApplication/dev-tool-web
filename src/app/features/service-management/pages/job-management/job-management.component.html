<app-page-shell
  [title]="screen.title"
  [subtitle]="screen.description"
  [breadcrumb]="screen.breadcrumb"
  layout="wide"
>
  <app-action-toolbar
    page-actions
    [actions]="screen.actions"
    (actionClick)="onToolbarAction($event)"
  ></app-action-toolbar>

  <app-responsive-grid page-summary [columns]="4" gap="md">
    @for (metric of screen.metrics; track metric.label) {
      <app-summary-metric-card
        [label]="metric.label"
        [value]="metric.value"
        [trend]="metric.trend"
        [trendVariant]="metric.trendVariant ?? 'default'"
      ></app-summary-metric-card>
    }
  </app-responsive-grid>

  <app-section-panel
    page-toolbar
    title="serviceManagement.filter.title"
    subtitle="serviceManagement.filter.description"
  >
    <app-filter-panel
      [filters]="screen.filters"
      [values]="filterValues()"
      (valueChange)="onFilterChange($event)"
      (apply)="onFilterChange($event)"
      (reset)="onFilterReset()"
    ></app-filter-panel>
  </app-section-panel>

  <app-table
    [config]="screen.table"
    [data]="jobs()"
    (rowClick)="openDetail($event)"
    (actionClick)="onTableAction($event)"
  ></app-table>
</app-page-shell>

<app-drawer
  [open]="drawerOpen()"
  title="serviceManagement.drawer.jobTitle"
  size="xl"
  (closed)="closeDrawer()"
>
  @if (selectedJob(); as job) {
    <div class="job-detail">
      <div class="job-detail__hero">
        <div>
          <p class="job-detail__eyebrow">{{ job.handler }}</p>
          <h2>{{ job.name }}</h2>
          <p>{{ job.description }}</p>
        </div>
        <app-badge
          [label]="job.statusLabel"
          [variant]="job.status === 'running' ? 'success' : job.status === 'failed' ? 'danger' : job.status === 'paused' ? 'warning' : 'muted'"
        ></app-badge>
      </div>

      <app-responsive-grid [columns]="3" gap="md">
        <app-summary-metric-card
          label="serviceManagement.field.successRate"
          [value]="job.successRate + '%'"
          trend="24h"
          trendVariant="info"
        ></app-summary-metric-card>
        <app-summary-metric-card
          label="serviceManagement.field.retryCount"
          [value]="job.retryCount"
        ></app-summary-metric-card>
        <app-summary-metric-card
          label="serviceManagement.field.duration"
          [value]="job.durationMs"
          suffix=" ms"
        ></app-summary-metric-card>
      </app-responsive-grid>

      <app-section-panel title="serviceManagement.drawer.overview" density="compact">
        <app-key-value-list [items]="selectedJobDetails()"></app-key-value-list>
      </app-section-panel>

      <app-section-panel title="serviceManagement.drawer.payload" density="compact">
        <app-json-viewer [value]="job.payload" [collapsed]="true"></app-json-viewer>
      </app-section-panel>
    </div>
  }

  <div drawer-footer class="job-detail__footer">
    <app-button
      label="close"
      variant="secondary"
      (buttonClick)="closeDrawer()"
    ></app-button>
    <app-button
      label="edit"
      icon="pi pi-pencil"
      (buttonClick)="editSelectedJob()"
    ></app-button>
  </div>
</app-drawer>
